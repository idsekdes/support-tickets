<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Cetak Dokumentasi Profesional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Pengaturan Cetak Halaman A4 */
        @page {
            size: A4 portrait;
            margin: 5mm;
        }

        @media print {
            body {
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-container {
                box-shadow: none !important;
                border: 2px solid #1e3a8a !important;
                width: 100% !important;
                max-width: 100% !important;
                height: 285mm !important;
                max-height: 285mm !important;
                padding: 6mm 8mm !important;
                margin: 0 auto !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
            }
            .photo-box {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen py-6 px-4">

    <!-- PANEL KONTROL (Hanya Tampil di Layar, Hilang saat Cetak) -->
    <div class="no-print max-w-4xl mx-auto mb-6 bg-white p-5 rounded-xl shadow-md border border-slate-200 flex flex-wrap items-center justify-between gap-4">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Panel Kontrol Dokumentasi</h1>
            <p class="text-sm text-slate-500">Klik "Cetak / Simpan PDF" untuk hasil 1 halaman penuh secara profesional.</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="resetData()" class="px-4 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 font-medium text-sm rounded-lg transition-colors border border-rose-200">
                Reset Semua
            </button>
            <button onclick="window.print()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg shadow-sm transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                </svg>
                Cetak / Simpan PDF
            </button>
        </div>
    </div>

    <!-- LEMBAR DOKUMENTASI (FORMAT A4: 2 Kolom x 5 Baris Foto Maksimal) -->
    <div class="print-container bg-white w-[210mm] h-[297mm] mx-auto p-[8mm] shadow-2xl border-2 border-blue-900 rounded-lg flex flex-col justify-between box-border overflow-hidden">
        
        <!-- HEADER DOKUMEN -->
        <header class="text-center border-b-2 border-blue-900 pb-2 mb-2 shrink-0">
            <h2 id="title-main" contenteditable="true" class="text-base font-bold uppercase tracking-wide text-blue-950 outline-none focus:bg-blue-50 px-2 py-0.5 rounded transition">
                DOKUMENTASI
            </h2>
            <h3 id="title-sub1" contenteditable="true" class="text-xs font-bold uppercase tracking-tight text-slate-800 outline-none focus:bg-blue-50 px-2 py-0.5 rounded transition mt-0.5">
                PEMBERIAN MAKANAN TAMBAHAN STUNTING (31 ORANG) 90 HARI
            </h3>
            <h3 id="title-sub2" contenteditable="true" class="text-xs font-bold uppercase tracking-tight text-slate-800 outline-none focus:bg-blue-50 px-2 py-0.5 rounded transition">
                DESA WANI LUMBUMPETIGO TAHUN 2025
            </h3>
            <div class="inline-block mt-1 px-3 py-0.5 bg-blue-50 border border-blue-200 rounded text-blue-800 font-bold text-[11px] uppercase tracking-wider">
                <span id="title-day" contenteditable="true" class="outline-none focus:bg-white px-1 rounded">HARI KE-30</span>
            </div>
        </header>

        <!-- GRID 10 FOTO (2 Kolom x 5 Baris) Maximized Area -->
        <div class="grid grid-cols-2 gap-2 flex-grow overflow-hidden items-stretch content-stretch">
            
            <!-- Slot 1 hingga 10 -->
            <!-- Script di bawah akan otomatis membangkitkan 10 slot foto -->
            <div id="photo-grid-container" class="contents"></div>

        </div>

        <!-- FOOTER / CATATAN KECIL HALAMAN -->
        <footer class="text-center text-[9px] text-slate-400 mt-1 shrink-0 no-print">
            Dokumentasi Kegiatan Desa Wani Lumbumpetigo — Format Standar Cetak 1 Lembar A4
        </footer>

    </div>

    <!-- TEMPLATE MODAL/INPUT HELPER & JAVASCRIPT -->
    <script>
        // Inisialisasi 10 Slot Foto
        const container = document.getElementById('photo-grid-container');
        
        for (let i = 1; i <= 10; i++) {
            const slotHtml = `
                <div class="photo-box relative border-2 border-blue-900 rounded bg-slate-50 flex items-center justify-center overflow-hidden group h-full w-full">
                    <!-- Input File Tersembunyi -->
                    <input type="file" id="file-${i}" accept="image/*" class="hidden" onchange="previewImage(event, ${i})">
                    
                    <!-- Tombol Upload (Hanya tampil jika belum ada foto & saat tidak dicetak) -->
                    <label for="file-${i}" class="no-print absolute inset-0 cursor-pointer flex flex-col items-center justify-center bg-slate-900/40 hover:bg-slate-900/50 text-white transition-all opacity-0 group-hover:opacity-100 z-10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        <span class="text-xs font-semibold">Pilih Foto ${i}</span>
                    </label>

                    <!-- Tombol Hapus Foto (Muncul saat hover jika foto sudah ada) -->
                    <button onclick="removeImage(${i})" id="del-btn-${i}" class="no-print hidden absolute top-1 right-1 bg-rose-600 hover:bg-rose-700 text-white p-1 rounded shadow z-20 text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>

                    <!-- Area Tampilan Gambar -->
                    <div id="preview-wrapper-${i}" class="w-full h-full flex items-center justify-center bg-slate-200">
                        <span class="no-print text-slate-400 text-xs font-medium pointer-events-none">Foto ${i}</span>
                    </div>
                </div>
            `;
            container.innerHTML += slotHtml;
        }

        // Fungsi preview foto dan simpan ke localStorage
        function previewImage(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Data = e.target.result;
                    displayImage(index, base64Data);
                    localStorage.setItem(`doc_photo_${index}`, base64Data);
                }
                reader.readAsDataURL(file);
            }
        }

        function displayImage(index, src) {
            const wrapper = document.getElementById(`preview-wrapper-${index}`);
            wrapper.innerHTML = `<img src="${src}" class="w-full h-full object-cover" alt="Dokumentasi ${index}">`;
            document.getElementById(`del-btn-${index}`).classList.remove('hidden');
        }

        function removeImage(index) {
            const wrapper = document.getElementById(`preview-wrapper-${index}`);
            wrapper.innerHTML = `<span class="no-print text-slate-400 text-xs font-medium pointer-events-none">Foto ${index}</span>`;
            document.getElementById(`file-${index}`).value = '';
            document.getElementById(`del-btn-${index}`).classList.add('hidden');
            localStorage.removeItem(`doc_photo_${index}`);
        }

        // Auto-Save Header Text ke localStorage
        const editableIds = ['title-main', 'title-sub1', 'title-sub2', 'title-day'];
        editableIds.forEach(id => {
            const el = document.getElementById(id);
            // Load saved text
            const savedText = localStorage.getItem(`doc_text_${id}`);
            if (savedText) el.innerText = savedText;

            // Save on input
            el.addEventListener('input', () => {
                localStorage.setItem(`doc_text_${id}`, el.innerText);
            });
        });

        // Load saved images on page load
        window.addEventListener('DOMContentLoaded', () => {
            for (let i = 1; i <= 10; i++) {
                const savedPhoto = localStorage.getItem(`doc_photo_${i}`);
                if (savedPhoto) {
                    displayImage(i, savedPhoto);
                }
            }
        });

        // Reset Data
        function resetData() {
            if (confirm('Apakah Anda yakin ingin menghapus semua foto dan teks kembali ke awal?')) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
