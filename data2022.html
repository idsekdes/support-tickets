<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencarian Data Penduduk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen">

  <div class="max-w-7xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <header class="mb-6 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid font-bold fa-users text-blue-600"></i> Pencarian Data Penduduk
        </h1>
        <p class="text-sm text-slate-500 mt-1">Sistem informasi pencarian dan pemantauan data kependudukan.</p>
      </div>
      <div id="totalBadge" class="bg-blue-50 text-blue-700 px-4 py-2 rounded-lg font-semibold text-sm border border-blue-200 self-start md:self-auto">
        Total Data: <span id="totalCount">0</span>
      </div>
    </header>

    <!-- Kontrol Pencarian & Filter -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="Cari berdasarkan NIK, Nama, Alamat, dll..." 
          class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
      </div>
      <button id="refreshBtn" onclick="fetchData()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg flex items-center justify-center gap-2 transition-all">
        <i class="fa-solid fa-rotate"></i> Muat Ulang
      </button>
    </div>

    <!-- Tabel Data -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase font-semibold">
              <th class="p-4">No</th>
              <th class="p-4">Nama Lengkap</th>
              <th class="p-4">NIK</th>
              <th class="p-4">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 text-sm">
            <!-- Data akan diisi melalui JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- State Loading & Kosong -->
      <div id="loadingState" class="p-8 text-center text-slate-500">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600 mb-2"></i>
        <p>Mengambil data dari server...</p>
      </div>

      <div id="emptyState" class="hidden p-8 text-center text-slate-500">
        <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-300"></i>
        <p>Data tidak ditemukan.</p>
      </div>

      <!-- Pagination -->
      <div class="p-4 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
        <span class="text-sm text-slate-500" id="paginationInfo">Menampilkan 0 dari 0 data</span>
        <div class="flex gap-2">
          <button id="prevBtn" onclick="changePage(-1)" class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
          <button id="nextBtn" onclick="changePage(1)" class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Rincian Lengkap -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
          <i class="fa-solid fa-id-card text-blue-600"></i> Rincian Data Penduduk
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="p-6 overflow-y-auto flex-1 space-y-4" id="modalContent">
        <!-- Rincian data dinamis akan dimasukkan di sini -->
      </div>
      <div class="p-4 border-t border-slate-200 bg-slate-50 text-right">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-sm font-semibold">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzLcz-jsj8liPMGkyCvBr1j53aS1J0V3-6l0Mnd4josOBDu0_a1eeWIUkRB-ul6Icpsig/exec";
    
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const rowsPerPage = 10;

    // Fetch Data dari Apps Script
    async function fetchData() {
      showLoading(true);
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        
        // Menyesuaikan struktur data yang didapat
        allData = Array.isArray(result) ? result : (result.data || []);
        filteredData = [...allData];
        
        document.getElementById('totalCount').innerText = allData.length;
        currentPage = 1;
        renderTable();
      } catch (error) {
        console.error("Gagal mengambil data:", error);
        alert("Terjadi kesalahan saat memuat data dari server.");
      } finally {
        showLoading(false);
      }
    }

    // Render Tabel
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const emptyState = document.getElementById('emptyState');
      tbody.innerHTML = '';

      if (filteredData.length === 0) {
        emptyState.classList.remove('hidden');
        updatePaginationInfo(0, 0, 0);
        return;
      }
      emptyState.classList.add('hidden');

      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const paginatedData = filteredData.slice(start, end);

      paginatedData.forEach((item, index) => {
        const row = document.createElement('tr');
        row.className = "hover:bg-blue-50/50 transition-colors cursor-pointer";
        
        // Ambil kunci nama & NIK secara opsional (fleksibel sesuai format header sheet)
        const nama = item.Nama || item.nama || item['NAMA LENGKAP'] || item['Nama Lengkap'] || Object.values(item)[1] || 'N/A';
        const nik = item.NIK || item.nik || Object.values(item)[0] || 'N/A';

        row.innerHTML = `
          <td class="p-4 text-slate-500">${start + index + 1}</td>
          <td class="p-4 font-medium text-blue-600 hover:underline" onclick="showDetail(${start + index})">${nama}</td>
          <td class="p-4 text-slate-600">${nik}</td>
          <td class="p-4">
            <button onclick="showDetail(${start + index})" class="px-3 py-1 bg-blue-100 hover:bg-blue-200 text-blue-700 text-xs rounded-md font-medium transition-all">
              <i class="fa-solid fa-eye mr-1"></i> Detail
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });

      updatePaginationInfo(start + 1, Math.min(end, filteredData.length), filteredData.length);
    }

    // Pencarian Real-time
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      filteredData = allData.filter(item => {
        return Object.values(item).some(val => 
          String(val).toLowerCase().includes(query)
        );
      });
      currentPage = 1;
      renderTable();
    });

    // Tampilkan Modal Rincian
    function showDetail(index) {
      const item = filteredData[index];
      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = '';

      Object.entries(item).forEach(([key, value]) => {
        const detailRow = document.createElement('div');
        detailRow.className = "flex flex-col border-b border-slate-100 pb-2";
        detailRow.innerHTML = `
          <span class="text-xs uppercase font-bold text-slate-400">${key}</span>
          <span class="text-sm font-semibold text-slate-700">${value || '-'}</span>
        `;
        modalContent.appendChild(detailRow);
      });

      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailModal').classList.add('flex');
    }

    // Tutup Modal
    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('detailModal').classList.remove('flex');
    }

    // Pagination
    function changePage(direction) {
      const maxPage = Math.ceil(filteredData.length / rowsPerPage);
      if ((direction === -1 && currentPage > 1) || (direction === 1 && currentPage < maxPage)) {
        currentPage += direction;
        renderTable();
      }
    }

    function updatePaginationInfo(start, end, total) {
      document.getElementById('paginationInfo').innerText = `Menampilkan ${start}-${end} dari ${total} data`;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage >= Math.ceil(total / rowsPerPage) || total === 0;
    }

    function showLoading(isLoading) {
      document.getElementById('loadingState').style.display = isLoading ? 'block' : 'none';
      if(isLoading) document.getElementById('emptyState').classList.add('hidden');
    }

    // Inisialisasi awal
    fetchData();
  </script>
</body>
</html>
