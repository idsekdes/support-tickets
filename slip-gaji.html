 <body class="h-full overflow-auto" style="background:#e8ecf2; font-family:'Source Sans 3',sans-serif;">

  <script>
const defaultConfig = {

};

const employees = [
  { no:1, nama:"AMIR RAMANG", jabatan:"Kepala Desa", rek:".", siltap:2450000, vol:1, tipe:"desa" },
  { no:2, nama:"SYAMSUDDIN", jabatan:"Sekretaris Desa", rek:".", siltap:2250000, vol:1, tipe:"desa" },
  { no:3, nama:"SUNARTIN", jabatan:"Kaur Keuangan", rek:".", siltap:2100000, vol:1, tipe:"desa" },

  { no:5, nama:"FITRIA", jabatan:"Kaur Umum & Aset", rek:".", siltap:2100000, vol:1, tipe:"desa" },
  { no:6, nama:"SAIRMAN", jabatan:"Kasi Pemerintahan", rek:".", siltap:2100000, vol:1, tipe:"desa" },
  { no:7, nama:"DJIDAL RAGAIYA", jabatan:"Kasi Kesejahteraan", rek:".", siltap:2100000, vol:1, tipe:"desa" },

  { no:10, nama:"TAJRIN A LAMANIMPA", jabatan:"Kepala Dusun II", rek:".", siltap:2050000, vol:1, tipe:"desa" },
  { no:11, nama:"RUSLIN DG,MARODJA", jabatan:"Kepala Dusun III", rek:".", siltap:2050000, vol:1, tipe:"desa" },
  { no:1, nama:"ALWAN", jabatan:"Ketua BPD", rek:".", siltap:1000000, vol:1, tipe:"bpd" },
  { no:2, nama:"ANWAR RAMANG", jabatan:"Wakil Ketua BPD", rek:".", siltap:900000, vol:1, tipe:"bpd" },
  { no:3, nama:"DARMAWATI", jabatan:"Sekretaris BPD", rek:".", siltap:800000, vol:1, tipe:"bpd" },

];

function fmt(n) {
  return n.toLocaleString('id-ID');
}

function terbilang(n) {
  const satuan = ['','Satu','Dua','Tiga','Empat','Lima','Enam','Tujuh','Delapan','Sembilan','Sepuluh','Sebelas'];
  if (n < 12) return satuan[n];
  if (n < 20) return terbilang(n-10) + ' Belas';
  if (n < 100) return terbilang(Math.floor(n/10)) + ' Puluh' + (n%10?' '+terbilang(n%10):'');
  if (n < 200) return 'Seratus' + (n%100?' '+terbilang(n%100):'');
  if (n < 1000) return terbilang(Math.floor(n/100)) + ' Ratus' + (n%100?' '+terbilang(n%100):'');
  if (n < 2000) return 'Seribu' + (n%1000?' '+terbilang(n%1000):'');
  if (n < 1000000) return terbilang(Math.floor(n/1000)) + ' Ribu' + (n%1000?' '+terbilang(n%1000):'');
  if (n < 1000000000) return terbilang(Math.floor(n/1000000)) + ' Juta' + (n%1000000?' '+terbilang(n%1000000):'');
  return n.toString();
}

function buildSlip(emp, config) {
  const jumlah = emp.siltap * emp.vol;
  const c = { ...defaultConfig, ...config };
  return `
  <div class="slip-page bg-white rounded-xl shadow-lg mb-6 p-8" style="font-family:'${c.font_family}',sans-serif; color:${c.text_color}; font-size:${c.font_size}px;">
    <!-- Header -->
    <div class="text-center mb-1" style="border-bottom:3px double ${c.primary_color}; padding-bottom:12px;">
      <h2 class="font-bold tracking-wide" style="font-size:${c.font_size*1.3}px; color:${c.primary_color};">PEMERINTAH ${c.village_name.toUpperCase()}</h2>
      <h1 class="font-bold mt-1" style="font-size:${c.font_size*1.5}px; color:${c.primary_color};">${c.document_title}</h1>
      <p class="mt-1 font-semibold" style="font-size:${c.font_size*0.95}px;">${c.period_text}</p>
    </div>

    <!-- Info Pegawai -->
    <div class="mt-5 mb-4 grid grid-cols-2 gap-x-8 gap-y-1" style="font-size:${c.font_size}px;">
      <div class="flex"><span class="w-36 font-semibold">Nama</span><span>: ${emp.nama}</span></div>
      <div class="flex"><span class="w-36 font-semibold">No. Rekening</span><span>: ${emp.rek}</span></div>
      <div class="flex"><span class="w-36 font-semibold">Jabatan</span><span>: ${emp.jabatan}</span></div>
      <div class="flex"><span class="w-36 font-semibold">No. Urut</span><span>: ${emp.no}</span></div>
    </div>

    <!-- Tabel Gaji -->
    <table class="slip-table w-full text-center" style="border-collapse:collapse; font-size:${c.font_size}px; border-color:${c.primary_color};">
      <thead>
        <tr style="background:${c.primary_color}; color:#fff;">
          <th class="w-12">NO</th>
          <th>URAIAN</th>
          <th class="w-40">SILTAP/BULAN (Rp)</th>
          <th class="w-20">VOLUME</th>
          <th class="w-44">JUMLAH (Rp)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td class="text-left">${emp.tipe === 'bpd' ? 'Tunjangan BPD' : 'Penghasilan Tetap (Siltap)'}</td>
          <td class="text-right">${fmt(emp.siltap)}</td>
          <td>${emp.vol}</td>
          <td class="text-right font-semibold">${fmt(jumlah)}</td>
        </tr>
        <tr style="background:#f0f4f8;">
          <td colspan="4" class="text-right font-bold" style="color:${c.primary_color};">TOTAL DITERIMA</td>
          <td class="text-right font-bold" style="color:${c.accent_color};">Rp ${fmt(jumlah)}</td>
        </tr>
      </tbody>
    </table>

    <!-- Terbilang -->
    <div class="mt-3 p-3 rounded-lg text-sm italic" style="background:#f0f4f8; border-left:4px solid ${c.accent_color};">
      <strong>Terbilang:</strong> ${terbilang(jumlah)} Rupiah
    </div>

    <!-- Tanda Tangan -->
    <div class="mt-10 flex justify-between items-start" style="font-size:${c.font_size}px;">
      <div class="text-center">
        <p>Penerima,</p>
        <div class="h-20"></div>
        <p class="font-bold border-t pt-1" style="border-color:${c.primary_color}; min-width:180px;">${emp.nama}</p>
        <p class="text-sm">${emp.jabatan}</p>
      </div>
      <div class="text-center">
        <p>Mengetahui,</p>
        <p class="font-semibold">Kepala Desa Wani Lumbumpetigo</p>
        <div class="h-16"></div>
        <p class="font-bold border-t pt-1" style="border-color:${c.primary_color}; min-width:180px;">AMIR RAMANG</p>
        <p class="text-sm">Kepala Desa</p>
      </div>
    </div>
  </div>`;
}

function renderSlips(config) {
  const typeVal = document.getElementById('typeSelect').value;
  const personVal = document.getElementById('personSelect').value;
  const container = document.getElementById('slipContainer');
  
  let list = employees;
  if (typeVal !== 'all') list = list.filter(e => e.tipe === typeVal);
  if (personVal !== 'all') list = list.filter(e => `${e.tipe}-${e.no}` === personVal);
  
  container.innerHTML = list.map(e => buildSlip(e, config)).join('');
}

// Populate type select
const typeSelect = document.getElementById('typeSelect');
typeSelect.addEventListener('change', () => {
  const personSelect = document.getElementById('personSelect');
  personSelect.value = 'all';
  updatePersonSelect();
});

// Update person select based on type
function updatePersonSelect() {
  const typeVal = document.getElementById('typeSelect').value;
  const personSelect = document.getElementById('personSelect');
  let filtered = employees;
  if (typeVal !== 'all') filtered = filtered.filter(e => e.tipe === typeVal);
  
  personSelect.innerHTML = '<option value="all">📄 Cetak Semua</option>';
  filtered.forEach(e => {
    const opt = document.createElement('option');
    opt.value = `${e.tipe}-${e.no}`;
    opt.textContent = `${e.no}. ${e.nama} (${e.jabatan})`;
    personSelect.appendChild(opt);
  });
  renderSlips({});
}

// Populate select
updatePersonSelect();

const sel = document.getElementById('personSelect');
sel.addEventListener('change', () => renderSlips(window.elementSdk?.config || {}));

// Print functionality
document.getElementById('printBtn').addEventListener('click', () => {
  setTimeout(() => {
    window.print();
  }, 100);
});

// Export PDF functionality
document.getElementById('exportPdfBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportPdfBtn');
  const originalHTML = btn.innerHTML;
  
  try {
    btn.disabled = true;
    btn.style.opacity = '0.6';
    btn.innerHTML = '<i data-lucide="loader" style="width:16px;height:16px; animation: spin 1s linear infinite;"></i> Membuat PDF...';
    lucide.createIcons();
    
    const typeVal = document.getElementById('typeSelect').value;
    const personVal = document.getElementById('personSelect').value;
    const config = window.elementSdk?.config || {};
    
    let list = employees;
    if (typeVal !== 'all') list = list.filter(e => e.tipe === typeVal);
    if (personVal !== 'all') list = list.filter(e => `${e.tipe}-${e.no}` === personVal);
    
    const element = document.createElement('div');
    element.style.background = 'white';
    element.innerHTML = list.map(emp => buildSlip(emp, config)).join('');
    
    const opt = {
      margin: 10,
      filename: `Slip_Gaji_${config.period_text?.replace(/\s+/g, '_') || 'Periode'}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    
    await html2pdf().set(opt).from(element).save();
    
    btn.innerHTML = originalHTML;
    btn.disabled = false;
    btn.style.opacity = '1';
    lucide.createIcons();
  } catch (err) {
    console.error('PDF Export Error:', err);
    btn.innerHTML = '❌ Error PDF';
    btn.disabled = false;
    btn.style.opacity = '1';
    setTimeout(() => {
      btn.innerHTML = originalHTML;
      lucide.createIcons();
    }, 2000);
  }
});

const style = document.createElement('style');
style.textContent = `

    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
`;
document.head.appendChild(style);

  const htmlContent = `<!DOCTYPE html>

      <tbody>

        <tr class="total-row">
          <td colspan="4" style="text-align: right; font-weight: bold; color: #1a2744;">TOTAL DITERIMA</td>
          <td>Rp ${jumlah.toLocaleString('id-ID')}</td>
        </tr>
      </tbody>
    </table>

    <div class="terbilang">
      <strong>Terbilang:</strong> ${terbilang(jumlah)} Rupiah
    </div>

    <div class="signature-section">
      <div class="signature-box">
        <div class="label">Penerima,</div>
        <div class="name">${emp.nama}</div>
        <div class="position">${emp.jabatan}</div>
      </div>
      <div class="signature-box">
        <div class="label">Mengetahui,</div>
        <div style="font-weight: 500;">Kepala Desa Wani Lumbumpetigo</div>
        <div class="name">AMIR RAMANG</div>
        <div class="position">Kepala Desa</div>
      </div>
    </div>
  </div>
  `;
}).join('')}
</body>
</html>`;

  // Create and download file
  const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  const fileName = `Slip_Gaji_${config.period_text?.replace(/\s+/g, '_') || 'Periode'}.html`;
  link.setAttribute('href', url);
  link.setAttribute('download', fileName);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});

// Element SDK
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    const c = { ...defaultConfig, ...config };
    document.body.style.background = c.background_color;
    renderSlips(config);
  },
  mapToCapabilities: (config) => {
    const c = { ...defaultConfig, ...config };
    function mut(key) {
      return { get: () => c[key], set: (v) => { c[key] = v; window.elementSdk.setConfig({ [key]: v }); } };
    }
    return {
      recolorables: [mut('background_color'), mut('surface_color'), mut('text_color'), mut('primary_color'), mut('accent_color')],
      borderables: [],
      fontEditable: mut('font_family'),
      fontSizeable: mut('font_size')
    };
  },
  mapToEditPanelValues: (config) => {
    const c = { ...defaultConfig, ...config };
    return new Map([
      ["document_title", c.document_title],
      ["village_name", c.village_name],
      ["period_text", c.period_text]
    ]);
  }
});

renderSlips({});
lucide.createIcons();
</script>
