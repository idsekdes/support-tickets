<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabel Data Desa</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background-color: #ffffff;
    }

    /* Baris Aksi Atas (Tombol WhatsApp) */
    .action-bar {
      margin-bottom: 12px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #25D366;
      color: #ffffff;
      border: none;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-wa:hover {
      background-color: #1ebe5d;
    }

    .btn-wa svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Styling Tabel Utama */
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1.5px solid #000000;
      font-size: 14px;
    }

    th, td {
      border: 1.5px solid #000000;
      padding: 8px 14px;
    }

    /* Header Tabel */
    thead th {
      background-color: #4cc44b;
      color: #000000;
      font-weight: 700;
      text-align: center;
    }

    /* Baris Data Utama */
    tbody td {
      background-color: #ffffff;
      color: #222222;
      text-align: center;
    }

    .col-desa {
      font-weight: 700;
      color: #000000;
    }

    .col-aplikasi {
      font-weight: 700;
      color: #16325c;
    }

    /* Wrapper Nilai & Opsi Edit pada Kolom Capaian */
    .capaian-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .nilai-capaian {
      min-width: 42px;
      display: inline-block;
    }

    .input-capaian {
      width: 55px;
      padding: 2px 4px;
      font-family: inherit;
      font-size: 14px;
      text-align: center;
      border: 1px solid #4cc44b;
      border-radius: 3px;
      outline: none;
    }

    .btn-edit-capaian {
      background-color: transparent;
      border: 1px solid #cccccc;
      color: #16325c;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-edit-capaian:hover {
      background-color: #16325c;
      color: #ffffff;
      border-color: #16325c;
    }

    /* Kolom Opsi */
    .col-opsi {
      text-align: right;
      padding-right: 18px;
    }

    .col-opsi a {
      text-decoration: none;
      font-weight: 700;
      color: #000000;
    }

    .col-opsi a:hover {
      text-decoration: underline;
    }

    /* Area Tombol Selanjutnya di Bawah Tabel */
    .bottom-nav {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-selanjutnya {
      display: inline-block;
      width: 12%;
      min-width: 125px;
      background-color: #002366;
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      padding: 5px 12px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn-selanjutnya:hover {
      background-color: #003399;
    }
  </style>
</head>
<body>

  <!-- Tombol Bagikan ke WhatsApp -->
  <div class="action-bar">
    <button type="button" class="btn-wa" onclick="bagikanKeWhatsApp()">
      <svg viewBox="0 0 448 512" aria-hidden="true">
        <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
      </svg>
      Bagikan ke WhatsApp
    </button>
  </div>

  <!-- Tabel Data -->
  <table id="tabelData">
    <thead>
      <tr>
        <th style="width: 5%;">No</th>
        <th style="width: 21%;">Desa</th>
        <th style="width: 15%;">Kecamatan</th>
        <th style="width: 15%;">Aplikasi</th>
        <th style="width: 17%;">Capaian wajib 80%</th>
        <th style="width: 15%;">Diperbarui</th>
        <th style="width: 12%;">opsi</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td class="col-desa">Wani Lumbumpetigo</td>
        <td>Tanantovea</td>
        <td class="col-aplikasi">e-HDW</td>
        <td>
          <div class="capaian-wrapper">
            <span class="nilai-capaian">100%</span>
            <button type="button" class="btn-edit-capaian" onclick="toggleEditCapaian(this)">Edit</button>
          </div>
        </td>
        <td>25 Nov 2026, 12:08</td>
        <td class="col-opsi"><a href="#">Lihat</a></td>
      </tr>
      <tr>
        <td>2</td>
        <td class="col-desa">Wani Lumbumpetigo</td>
        <td>Tanantovea</td>
        <td class="col-aplikasi">PBB</td>
        <td>
          <div class="capaian-wrapper">
            <span class="nilai-capaian">1%</span>
            <button type="button" class="btn-edit-capaian" onclick="toggleEditCapaian(this)">Edit</button>
          </div>
        </td>
        <td>20 Nov 2026, 05:24</td>
        <td class="col-opsi"><a href="#">Lihat</a></td>
      </tr>
      <tr>
        <td>3</td>
        <td class="col-desa">Wani Lumbumpetigo</td>
        <td>Tanantovea</td>
        <td class="col-aplikasi">Perlinsos</td>
        <td>
          <div class="capaian-wrapper">
            <span class="nilai-capaian">6%</span>
            <button type="button" class="btn-edit-capaian" onclick="toggleEditCapaian(this)">Edit</button>
          </div>
        </td>
        <td>25 Nov 2026, 10:46</td>
        <td class="col-opsi"><a href="#">Lihat</a></td>
      </tr>
    </tbody>
  </table>

  <!-- Tombol Selanjutnya di Pojok Kanan Bawah -->
  <div class="bottom-nav">
    <a href="#" class="btn-selanjutnya">Selanjutnya &rarr;</a>
  </div>

  <script>
    function toggleEditCapaian(tombol) {
      const wrapper = tombol.parentElement;
      const isEditing = tombol.dataset.editing === 'true';

      if (!isEditing) {
        // Masuk ke mode edit
        const spanNilai = wrapper.querySelector('.nilai-capaian');
        const angkaSaatIni = spanNilai.innerText.replace('%', '').trim();

        const input = document.createElement('input');
        input.type = 'number';
        input.min = 0;
        input.max = 100;
        input.value = angkaSaatIni;
        input.className = 'input-capaian';

        // Simpan otomatis saat menekan tombol Enter
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            toggleEditCapaian(tombol);
          }
        });

        wrapper.replaceChild(input, spanNilai);
        input.focus();
        input.select();

        tombol.innerText = 'Simpan';
        tombol.dataset.editing = 'true';
      } else {
        // Simpan perubahan dan kembali ke mode tampilan teks
        const input = wrapper.querySelector('.input-capaian');
        let nilaiBaru = parseInt(input.value, 10);

        if (isNaN(nilaiBaru) || nilaiBaru < 0) nilaiBaru = 0;
        if (nilaiBaru > 100) nilaiBaru = 100;

        const spanNilai = document.createElement('span');
        spanNilai.className = 'nilai-capaian';
        spanNilai.innerText = `${nilaiBaru}%`;

        wrapper.replaceChild(spanNilai, input);

        tombol.innerText = 'Edit';
        tombol.dataset.editing = 'false';
      }
    }

    function bagikanKeWhatsApp() {
      const baris = document.querySelectorAll('#tabelData tbody tr');
      let pesan = "*Laporan Capaian Aplikasi Desa*\n\n";

      baris.forEach((tr) => {
        const kolom = tr.querySelectorAll('td');
        const no = kolom[0].innerText.trim();
        const desa = kolom[1].innerText.trim();
        const kecamatan = kolom[2].innerText.trim();
        const aplikasi = kolom[3].innerText.trim();

        // Ambil nilai capaian (baik saat mode teks maupun sedang diedit)
        const spanCapaian = kolom[4].querySelector('.nilai-capaian');
        const inputCapaian = kolom[4].querySelector('.input-capaian');
        const capaian = spanCapaian
          ? spanCapaian.innerText.trim()
          : `${inputCapaian.value}%`;

        const diperbarui = kolom[5].innerText.trim();

        pesan += `${no}. *${desa}* (Kec. ${kecamatan})\n`;
        pesan += `   • Aplikasi: *${aplikasi}*\n`;
        pesan += `   • Capaian: *${capaian}*\n`;
        pesan += `   • Diperbarui: ${diperbarui}\n\n`;
      });

      const urlWhatsApp = `https://wa.me/?text=${encodeURIComponent(pesan)}`;
      window.open(urlWhatsApp, '_blank');
    }
  </script>

</body>
</html>
