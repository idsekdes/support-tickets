<style>
  .galeri-desa-wrapper {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .galeri-desa-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .galeri-desa-header h2 {
    margin: 0 0 6px;
    font-size: 1.6rem;
    color: #111827;
  }

  .galeri-desa-header p {
    margin: 0;
    font-size: 0.95rem;
    color: #6b7280;
  }

  .galeri-desa-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }

  .galeri-desa-card {
    position: relative;
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .galeri-desa-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
  }

  .galeri-desa-card img {
    display: block;
    width: 100%;
    height: 210px;
    object-fit: cover;
    transition: transform 0.35s ease;
  }

  .galeri-desa-card:hover img {
    transform: scale(1.05);
  }

  .galeri-desa-caption {
    padding: 10px 14px;
    font-size: 0.875rem;
    font-weight: 500;
    color: #374151;
    background: #ffffff;
    border-top: 1px solid #f3f4f6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Lightbox Modal */
  .galeri-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(15, 23, 42, 0.88);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .galeri-lightbox.active {
    display: flex;
  }

  .galeri-lightbox-content {
    position: relative;
    max-width: 900px;
    width: 100%;
    text-align: center;
  }

  .galeri-lightbox-content img {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 10px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
  }

  .galeri-lightbox-title {
    margin-top: 12px;
    color: #f9fafb;
    font-size: 0.95rem;
  }

  .galeri-lightbox-close {
    position: fixed;
    top: 18px;
    right: 24px;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .galeri-lightbox-close:hover {
    background: rgba(255, 255, 255, 0.3);
  }

  @media (max-width: 600px) {
    .galeri-desa-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .galeri-desa-card img {
      height: 140px;
    }
  }
</style>

<!-- Lightbox -->
<div class="galeri-lightbox" id="galeriLightbox" aria-hidden="true">
  <button type="button" class="galeri-lightbox-close" id="galeriLightboxClose" aria-label="Tutup">&times;</button>
  <div class="galeri-lightbox-content">
    <img id="galeriLightboxImg" src="" alt="">
    <div class="galeri-lightbox-title" id="galeriLightboxTitle"></div>
  </div>
</div>

<script>
  (function () {
    const grid = document.getElementById("galeriDesaGrid");
    const lightbox = document.getElementById("galeriLightbox");
    const lightboxImg = document.getElementById("galeriLightboxImg");
    const lightboxTitle = document.getElementById("galeriLightboxTitle");
    const closeBtn = document.getElementById("galeriLightboxClose");

    if (!grid || !lightbox) return;

    grid.addEventListener("click", function (e) {
      const card = e.target.closest(".galeri-desa-card");
      if (!card) return;
      const img = card.querySelector("img");
      if (!img) return;

      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt || "";
      lightboxTitle.textContent = card.dataset.title || img.alt || "";
      lightbox.classList.add("active");
      lightbox.setAttribute("aria-hidden", "false");
    });

    function closeLightbox() {
      lightbox.classList.remove("active");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImg.src = "";
    }

    closeBtn.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", function (e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && lightbox.classList.contains("active")) {
        closeLightbox();
      }
    });
  })();
</script>
