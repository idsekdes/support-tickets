<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEggGbqNiUbZmqKIaxT_qPDDMbBes9Hsy-XX88Cr7Ql-DBbrxNMX5RDrLlK2J8gk7_4KybGYVYiK09F7eo2MTHGszfppclIU_ZvW8iaQKhwq2sM_s61fSM2l0SD03me9okqbnUaZikaPXw4LnOUsXZBNHmoCv-FKjSiTMDWPP3nHhTmeOp_6WyQQZqKUMMlO/s120/logo%20donggala-fix-2025.png">
  <title>Form Upload Sertifikat Desa - e-HDW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .form-container {
      max-width: 520px;
      margin: 45px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .header-title {
      color: #198754;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="form-container">
    <div class="text-center mb-4">
      <h4 class="header-title">UPLOAD SERTIFIKAT DESA</h4>
      <p class="text-muted small">Rekapitulasi Sertifikat Bimtek e-HDW</p>
    </div>

    <!-- FORM UPLOAD -->
    <form id="formUpload" onsubmit="kirimFile(event)">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nama Desa</label>
        <input type="text" class="form-control" id="desa" required placeholder="Masukkan nama desa">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Kecamatan</label>
        <input type="text" class="form-control" id="kecamatan" required placeholder="Masukkan nama kecamatan">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Pilih File Sertifikat (PDF / JPG / PNG)</label>
        <input type="file" class="form-control" id="fileSertifikat" accept=".pdf,.jpg,.jpeg,.png" required>
        <div class="form-text">Maksimal ukuran file 10 MB.</div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" id="btnSubmit" class="btn btn-success btn-lg">
          📤 Upload & Simpan Data
        </button>
      </div>
    </form>

    <!-- AREA LOADING -->
    <div id="loadingArea" class="text-center my-4 d-none">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-2 text-muted">Sedang mengunggah file ke Google Drive & merekap data...</p>
    </div>

    <!-- AREA SUKSES -->
    <div id="hasilArea" class="text-center my-4 d-none">
      <div class="alert alert-success">
        <h5 class="alert-heading fw-bold">Upload Berhasil!</h5>
        <p class="mb-0">Sertifikat <strong>DESA <span id="resDesa"></span></strong> (Kecamatan <span id="resKecamatan"></span>) telah tersimpan dan terekap.</p>
      </div>
      <div class="d-grid gap-2">
        <a id="btnLihatFile" href="#" target="_blank" class="btn btn-outline-primary">
          📄 Lihat File di Google Drive
        </a>
        <button type="button" class="btn btn-link text-decoration-none mt-2" onclick="resetForm()">
          + Upload Sertifikat Desa Lainnya
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  function kirimFile(e) {
    e.preventDefault();

    const fileInput = document.getElementById('fileSertifikat');
    const file = fileInput.files[0];

    if (!file) {
      alert("Silakan pilih file sertifikat terlebih dahulu.");
      return;
    }

    // Validasi ukuran file maksimal 10 MB
    if (file.size > 10 * 1024 * 1024) {
      alert("Ukuran file terlalu besar! Maksimal 10 MB.");
      return;
    }

    document.getElementById('formUpload').classList.add('d-none');
    document.getElementById('loadingArea').classList.remove('d-none');

    const reader = new FileReader();
    reader.onload = function(event) {
      const payload = {
        desa: document.getElementById('desa').value,
        kecamatan: document.getElementById('kecamatan').value,
        fileName: file.name,
        mimeType: file.type,
        fileData: event.target.result
      };

      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('loadingArea').classList.add('d-none');
          if (res.status === "sukses") {
            document.getElementById('resDesa').innerText = res.desa;
            document.getElementById('resKecamatan').innerText = res.kecamatan;
            document.getElementById('btnLihatFile').href = res.fileUrl;
            document.getElementById('hasilArea').classList.remove('d-none');
          } else {
            alert("Gagal mengunggah: " + res.pesan);
            document.getElementById('formUpload').classList.remove('d-none');
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('loadingArea').classList.add('d-none');
          document.getElementById('formUpload').classList.remove('d-none');
          alert("Terjadi kesalahan koneksi: " + err.message);
        })
        .prosesUploadSertifikat(payload);
    };

    reader.readAsDataURL(file);
  }

  function resetForm() {
    document.getElementById('formUpload').reset();
    document.getElementById('hasilArea').classList.add('d-none');
    document.getElementById('formUpload').classList.remove('d-none');
  }
</script>

</body>
</html>
