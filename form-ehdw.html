<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Upload Sertifikat Desa - e-HDW</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .form-container {
      max-width: 520px;
      margin: 45px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .header-title {
      color: #198754;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="form-container">
    <div class="text-center mb-4">
      <h4 class="header-title">UPLOAD SERTIFIKAT DESA</h4>
      <p class="text-muted small">Rekapitulasi Sertifikat Bimtek e-HDW</p>
    </div>

    <!-- ALERT ERROR -->
    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <!-- FORM UPLOAD -->
    <form id="formUpload" onsubmit="kirimFile(event)">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nama Desa</label>
        <input type="text" class="form-control" id="desa" required placeholder="Masukkan nama desa">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Kecamatan</label>
        <input type="text" class="form-control" id="kecamatan" required placeholder="Masukkan nama kecamatan">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Jabatan</label>
        <select class="form-select" id="jabatan" required>
          <option value="" disabled selected>-- Pilih Jabatan --</option>
          <option value="ADMIN DESA">ADMIN DESA</option>
          <option value="KPM">KPM</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Pilih File Sertifikat (PDF / JPG / PNG)</label>
        <input type="file" class="form-control" id="fileSertifikat" accept=".pdf,.jpg,.jpeg,.png" required>
        <div class="form-text">Disarankan file PDF di bawah 5 MB atau foto JPG/PNG.</div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" id="btnSubmit" class="btn btn-success btn-lg">
          📤 Upload & Simpan Data
        </button>
      </div>
    </form>

    <!-- AREA LOADING -->
    <div id="loadingArea" class="text-center my-4 d-none">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-2 text-muted fw-semibold" id="statusLoading">Mengunggah ke Google Drive...</p>
    </div>

    <!-- AREA SUKSES -->
    <div id="hasilArea" class="text-center my-4 d-none">
      <div class="alert alert-success">
        <h5 class="alert-heading fw-bold">Upload Berhasil!</h5>
        <p class="mb-0">
          Sertifikat <strong><span id="resJabatan"></span></strong> — <strong>DESA <span id="resDesa"></span></strong> (Kecamatan <span id="resKecamatan"></span>) telah tersimpan dan direkap.
        </p>
      </div>
      <div class="d-grid gap-2">
        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vTuvz8kh_YY0xode24ydq7ubqAr5RS_d0hl6hC371cjTS6VHSqdqPMYCJfMksVBpk4RzP-SVMid5L7F/pubhtml?gid=0&single=true" target="_blank" class="btn btn-outline-primary">
          📊 Cek Rekapitulasi Spreadsheet
        </a>
        <button type="button" class="btn btn-link text-decoration-none mt-2" onclick="resetForm()">
          + Upload Sertifikat Lainnya
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygHjJmtK4PzYHQlfrxwSlgY_PUP3D_bFQ9lnAEZUpYaljZr80bY4KKECQRcGCxZznE/exec";

  function tampilkanError(pesan) {
    document.getElementById('loadingArea').classList.add('d-none');
    document.getElementById('formUpload').classList.remove('d-none');
    const alertBox = document.getElementById('errorAlert');
    alertBox.innerText = "Gagal: " + pesan;
    alertBox.classList.remove('d-none');
  }

  function kirimFile(e) {
    e.preventDefault();
    document.getElementById('errorAlert').classList.add('d-none');

    const fileInput = document.getElementById('fileSertifikat');
    const file = fileInput.files[0];

    if (!file) {
      tampilkanError("Silakan pilih file sertifikat terlebih dahulu.");
      return;
    }

    if (file.type === "application/pdf" && file.size > 5 * 1024 * 1024) {
      tampilkanError("Ukuran PDF terlalu besar (maksimal 5 MB).");
      return;
    }

    document.getElementById('formUpload').classList.add('d-none');
    document.getElementById('loadingArea').classList.remove('d-none');

    const desaVal = document.getElementById('desa').value;
    const kecamatanVal = document.getElementById('kecamatan').value;
    const jabatanVal = document.getElementById('jabatan').value;

    if (file.type.startsWith('image/')) {
      kompresGambar(file, function(base64Kompres) {
        eksekusiFetch({
          desa: desaVal,
          kecamatan: kecamatanVal,
          jabatan: jabatanVal,
          fileName: file.name.replace(/\.[^/.]+$/, "") + ".jpg",
          mimeType: "image/jpeg",
          fileData: base64Kompres
        });
      });
    } else {
      const reader = new FileReader();
      reader.onload = function(event) {
        eksekusiFetch({
          desa: desaVal,
          kecamatan: kecamatanVal,
          jabatan: jabatanVal,
          fileName: file.name,
          mimeType: file.type,
          fileData: event.target.result
        });
      };
      reader.readAsDataURL(file);
    }
  }

  function kompresGambar(file, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 1600;

        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function eksekusiFetch(payload) {
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      setTimeout(() => {
        document.getElementById('loadingArea').classList.add('d-none');
        document.getElementById('resJabatan').innerText = payload.jabatan;
        document.getElementById('resDesa').innerText = payload.desa.trim().toUpperCase();
        document.getElementById('resKecamatan').innerText = payload.kecamatan.trim().toUpperCase();
        document.getElementById('hasilArea').classList.remove('d-none');
      }, 2500);

    } catch (err) {
      tampilkanError("Periksa koneksi internet Anda: " + err.message);
    }
  }

  function resetForm() {
    document.getElementById('formUpload').reset();
    document.getElementById('errorAlert').classList.add('d-none');
    document.getElementById('hasilArea').classList.add('d-none');
    document.getElementById('formUpload').classList.remove('d-none');
  }
</script>

</body>
</html>
